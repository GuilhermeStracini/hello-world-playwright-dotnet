name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "36 2 * * 2"

jobs:
  detect:
    name: Detect C# sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-csharp: ${{ steps.check.outputs.has-csharp }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Check for C# files
      id: check
      run: |
        if git ls-files '*.cs' '*.csproj' | grep -q .; then
          echo "has-csharp=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-csharp=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No C# sources found; skipping CodeQL analysis."
        fi

  analyze:
    name: Analyze
    needs: detect
    if: needs.detect.outputs.has-csharp == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        category: "security"
